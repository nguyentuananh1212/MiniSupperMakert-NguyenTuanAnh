<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 750" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Tahoma, Arial, sans-serif;">
  <defs>
    <!-- Shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="tblHeaderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="16" width="1090" height="50" rx="10" fill="url(#headerGrad)" filter="url(#shadow)" />
  <text x="575" y="47" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    HÌNH 2.4: SƠ ĐỒ THỰC THỂ LIÊN KẾT (DATABASE ERD DIAGRAM) - SQL SERVER CSDL NGUYENTUANANH_MINISUPPERMAKERT
  </text>

  <!-- Canvas Background for SSMS Diagram -->
  <rect x="30" y="80" width="1090" height="650" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="80" width="1090" height="32" rx="12" fill="#334155"/>
  <rect x="30" y="100" width="1090" height="12" fill="#334155"/>
  <text x="50" y="102" fill="#93C5FD" font-size="12" font-weight="700">SQL Server Management Studio</text>
  <text x="260" y="102" fill="#E2E8F0" font-size="12">[Database Diagram: NguyenTuanAnh_MiniSupperMakert_Diagram]</text>

  <!-- ================= TABLE 1: CATEGORIES (TOP LEFT) ================= -->
  <g id="table-categories" transform="translate(60, 130)">
    <rect x="0" y="0" width="220" height="135" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="220" height="28" rx="4" fill="url(#tblHeaderGrad)"/>
    <text x="110" y="19" fill="#0F172A" font-size="12.5" font-weight="700" text-anchor="middle">Categories</text>
    <line x1="0" y1="28" x2="220" y2="28" stroke="#94A3B8" stroke-width="1"/>
    
    <text x="12" y="48" fill="#B45309" font-size="11.5" font-weight="700">🔑 CategoryId</text>
    <text x="160" y="48" fill="#64748B" font-size="11">int (PK)</text>
    <line x1="8" y1="56" x2="212" y2="56" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="74" fill="#1E293B" font-size="11">CategoryName</text>
    <text x="145" y="74" fill="#64748B" font-size="11">nvarchar(100)</text>
    <line x1="8" y1="82" x2="212" y2="82" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="100" fill="#1E293B" font-size="11">Description</text>
    <text x="145" y="100" fill="#64748B" font-size="11">nvarchar(255)</text>
  </g>

  <!-- ================= TABLE 2: PRODUCTS (TOP CENTER) ================= -->
  <g id="table-products" transform="translate(380, 130)">
    <rect x="0" y="0" width="250" height="205" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="250" height="28" rx="4" fill="#DBEAFE"/>
    <text x="125" y="19" fill="#1E40AF" font-size="12.5" font-weight="700" text-anchor="middle">Products</text>
    <line x1="0" y1="28" x2="250" y2="28" stroke="#93C5FD" stroke-width="1"/>

    <text x="12" y="48" fill="#B45309" font-size="11.5" font-weight="700">🔑 ProductId</text>
    <text x="180" y="48" fill="#64748B" font-size="11">int (PK)</text>
    <line x1="8" y1="56" x2="242" y2="56" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="74" fill="#1E293B" font-size="11">Barcode</text>
    <text x="165" y="74" fill="#64748B" font-size="11">nvarchar(50) [UQ]</text>
    <line x1="8" y1="82" x2="242" y2="82" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="100" fill="#1E293B" font-size="11">ProductName</text>
    <text x="165" y="100" fill="#64748B" font-size="11">nvarchar(150)</text>
    <line x1="8" y1="108" x2="242" y2="108" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="126" fill="#1E293B" font-size="11">Price</text>
    <text x="165" y="126" fill="#64748B" font-size="11">decimal(18,2)</text>
    <line x1="8" y1="134" x2="242" y2="134" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="152" fill="#1E293B" font-size="11">StockQuantity</text>
    <text x="180" y="152" fill="#64748B" font-size="11">int</text>
    <line x1="8" y1="160" x2="242" y2="160" stroke="#E2E8F0" stroke-width="1"/>

    <text x="12" y="178" fill="#2563EB" font-size="11.5" font-weight="700">🔗 CategoryId</text>
    <text x="180" y="178" fill="#2563EB" font-size="11">int (FK)</text>
  </g>

  <!-- ================= TABLE 3: ORDERDETAILS (BOTTOM CENTER) ================= -->
  <g id="table-orderdetails" transform="translate(380, 440)">
    <rect x="0" y="0" width="250" height="205" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="250" height="28" rx="4" fill="#D1FAE5"/>
    <text x="125" y="19" fill="#065F46" font-size="12.5" font-weight="700" text-anchor="middle">OrderDetails</text>
    <line x1="0" y1="28" x2="250" y2="28" stroke="#A7F3D0" stroke-width="1"/>

    <text x="12" y="48" fill="#B45309" font-size="11.5" font-weight="700">🔑 OrderDetailId</text>
    <text x="180" y="48" fill="#64748B" font-size="11">int (PK)</text>
    <line x1="8" y1="56" x2="242" y2="56" stroke="#E2E8F0" stroke-width="1"/>

    <text x="12" y="74" fill="#059669" font-size="11.5" font-weight="700">🔗 OrderId</text>
    <text x="180" y="74" fill="#059669" font-size="11">int (FK)</text>
    <line x1="8" y1="82" x2="242" y2="82" stroke="#E2E8F0" stroke-width="1"/>

    <text x="12" y="100" fill="#2563EB" font-size="11.5" font-weight="700">🔗 ProductId</text>
    <text x="180" y="100" fill="#2563EB" font-size="11">int (FK)</text>
    <line x1="8" y1="108" x2="242" y2="108" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="126" fill="#1E293B" font-size="11">Quantity</text>
    <text x="180" y="126" fill="#64748B" font-size="11">int</text>
    <line x1="8" y1="134" x2="242" y2="134" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="152" fill="#1E293B" font-size="11">UnitPrice</text>
    <text x="165" y="152" fill="#64748B" font-size="11">decimal(18,2)</text>
    <line x1="8" y1="160" x2="242" y2="160" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="178" fill="#1E293B" font-size="11">LineTotal</text>
    <text x="165" y="178" fill="#64748B" font-size="11">decimal(18,2)</text>
  </g>

  <!-- ================= TABLE 4: ORDERS (BOTTOM RIGHT) ================= -->
  <g id="table-orders" transform="translate(740, 420)">
    <rect x="0" y="0" width="260" height="240" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="260" height="28" rx="4" fill="#D1FAE5"/>
    <text x="130" y="19" fill="#065F46" font-size="12.5" font-weight="700" text-anchor="middle">Orders</text>
    <line x1="0" y1="28" x2="260" y2="28" stroke="#A7F3D0" stroke-width="1"/>

    <text x="12" y="48" fill="#B45309" font-size="11.5" font-weight="700">🔑 OrderId</text>
    <text x="190" y="48" fill="#64748B" font-size="11">int (PK)</text>
    <line x1="8" y1="56" x2="252" y2="56" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="74" fill="#1E293B" font-size="11">OrderDate</text>
    <text x="190" y="74" fill="#64748B" font-size="11">datetime</text>
    <line x1="8" y1="82" x2="252" y2="82" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="100" fill="#1E293B" font-size="11">CashierUsername</text>
    <text x="175" y="100" fill="#64748B" font-size="11">nvarchar(50)</text>
    <line x1="8" y1="108" x2="252" y2="108" stroke="#E2E8F0" stroke-width="1"/>

    <text x="12" y="126" fill="#7C3AED" font-size="11.5" font-weight="700">🔗 CustomerId</text>
    <text x="190" y="126" fill="#7C3AED" font-size="11">int (FK)</text>
    <line x1="8" y1="134" x2="252" y2="134" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="152" fill="#1E293B" font-size="11">TotalAmount</text>
    <text x="175" y="152" fill="#64748B" font-size="11">decimal(18,2)</text>
    <line x1="8" y1="160" x2="252" y2="160" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="178" fill="#1E293B" font-size="11">DiscountAmount</text>
    <text x="175" y="178" fill="#64748B" font-size="11">decimal(18,2)</text>
    <line x1="8" y1="186" x2="252" y2="186" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="204" fill="#1E293B" font-size="11">FinalAmount</text>
    <text x="175" y="204" fill="#64748B" font-size="11">decimal(18,2)</text>
    <line x1="8" y1="212" x2="252" y2="212" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="228" fill="#1E293B" font-size="11">RewardPoints</text>
    <text x="190" y="228" fill="#64748B" font-size="11">int</text>
  </g>

  <!-- ================= TABLE 5: CUSTOMERS (TOP RIGHT) ================= -->
  <g id="table-customers" transform="translate(740, 130)">
    <rect x="0" y="0" width="260" height="205" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="260" height="28" rx="4" fill="#EDE9FE"/>
    <text x="130" y="19" fill="#5B21B6" font-size="12.5" font-weight="700" text-anchor="middle">Customers</text>
    <line x1="0" y1="28" x2="260" y2="28" stroke="#DDD6FE" stroke-width="1"/>

    <text x="12" y="48" fill="#B45309" font-size="11.5" font-weight="700">🔑 CustomerId</text>
    <text x="190" y="48" fill="#64748B" font-size="11">int (PK)</text>
    <line x1="8" y1="56" x2="252" y2="56" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="74" fill="#1E293B" font-size="11">CustomerName</text>
    <text x="175" y="74" fill="#64748B" font-size="11">nvarchar(100)</text>
    <line x1="8" y1="82" x2="252" y2="82" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="100" fill="#1E293B" font-size="11">PhoneNumber</text>
    <text x="175" y="100" fill="#64748B" font-size="11">nvarchar(20) [UQ]</text>
    <line x1="8" y1="108" x2="252" y2="108" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="126" fill="#1E293B" font-size="11">Address</text>
    <text x="175" y="126" fill="#64748B" font-size="11">nvarchar(255)</text>
    <line x1="8" y1="134" x2="252" y2="134" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="152" fill="#1E293B" font-size="11">RewardPoints</text>
    <text x="190" y="152" fill="#64748B" font-size="11">int</text>
    <line x1="8" y1="160" x2="252" y2="160" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="178" fill="#1E293B" font-size="11">MembershipRank</text>
    <text x="175" y="178" fill="#64748B" font-size="11">nvarchar(50)</text>
  </g>

  <!-- ================= TABLE 6: USERS (BOTTOM LEFT) ================= -->
  <g id="table-users" transform="translate(60, 440)">
    <rect x="0" y="0" width="220" height="185" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="220" height="28" rx="4" fill="url(#tblHeaderGrad)"/>
    <text x="110" y="19" fill="#0F172A" font-size="12.5" font-weight="700" text-anchor="middle">Users</text>
    <line x1="0" y1="28" x2="220" y2="28" stroke="#94A3B8" stroke-width="1"/>

    <text x="12" y="48" fill="#B45309" font-size="11.5" font-weight="700">🔑 UserId</text>
    <text x="160" y="48" fill="#64748B" font-size="11">int (PK)</text>
    <line x1="8" y1="56" x2="212" y2="56" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="74" fill="#1E293B" font-size="11">Username</text>
    <text x="145" y="74" fill="#64748B" font-size="11">nvarchar(50) [UQ]</text>
    <line x1="8" y1="82" x2="212" y2="82" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="100" fill="#1E293B" font-size="11">Password</text>
    <text x="145" y="100" fill="#64748B" font-size="11">nvarchar(255)</text>
    <line x1="8" y1="108" x2="212" y2="108" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="126" fill="#1E293B" font-size="11">FullName</text>
    <text x="145" y="126" fill="#64748B" font-size="11">nvarchar(100)</text>
    <line x1="8" y1="134" x2="212" y2="134" stroke="#E2E8F0" stroke-width="1"/>

    <text x="24" y="152" fill="#1E293B" font-size="11">Role</text>
    <text x="145" y="152" fill="#64748B" font-size="11">nvarchar(20)</text>
  </g>


  <!-- ================= FOREIGN KEY RELATIONSHIPS (SSMS STYLE: KEY - INFINITY) ================= -->

  <!-- FK 1: Categories (PK) -> Products (FK) -->
  <path d="M 280 178 L 380 308" fill="none" stroke="#2563EB" stroke-width="2.2"/>
  <!-- Key icon on Categories -->
  <text x="288" y="174" fill="#B45309" font-size="12" font-weight="bold">🔑 1</text>
  <!-- Infinity on Products -->
  <text x="355" y="304" fill="#2563EB" font-size="14" font-weight="bold">∞</text>

  <!-- FK 2: Customers (PK) -> Orders (FK) -->
  <path d="M 870 335 L 870 420" fill="none" stroke="#7C3AED" stroke-width="2.2"/>
  <text x="880" y="350" fill="#B45309" font-size="12" font-weight="bold">🔑 1</text>
  <text x="880" y="415" fill="#7C3AED" font-size="14" font-weight="bold">∞</text>

  <!-- FK 3: Orders (PK) -> OrderDetails (FK) -->
  <path d="M 740 468 L 630 514" fill="none" stroke="#059669" stroke-width="2.2"/>
  <text x="715" y="462" fill="#B45309" font-size="12" font-weight="bold">🔑 1</text>
  <text x="640" y="510" fill="#059669" font-size="14" font-weight="bold">∞</text>

  <!-- FK 4: Products (PK) -> OrderDetails (FK) -->
  <path d="M 505 335 L 505 440" fill="none" stroke="#2563EB" stroke-width="2.2"/>
  <text x="515" y="352" fill="#B45309" font-size="12" font-weight="bold">🔑 1</text>
  <text x="515" y="435" fill="#2563EB" font-size="14" font-weight="bold">∞</text>

</svg>
