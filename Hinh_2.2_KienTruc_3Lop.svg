<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="t1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="t2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="t3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="18" width="1120" height="52" rx="10" fill="url(#headerGrad)" filter="url(#shadow)" />
  <text x="590" y="50" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    HÌNH 2.2: SƠ ĐỒ KIẾN TRÚC HỆ THỐNG PHÂN TÁN 3 LỚP (3-TIER ARCHITECTURE) - SIÊU THỊ MINI FAMILY FRESH
  </text>

  <!-- ================= TIER 1: CLIENT TIER ================= -->
  <rect x="30" y="90" width="320" height="465" rx="14" fill="url(#t1Grad)" stroke="#93C5FD" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="45" y="105" width="290" height="34" rx="6" fill="#2563EB" />
  <text x="190" y="127" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">
    TẦNG GIAO DIỆN (PRESENTATION TIER)
  </text>
  <text x="190" y="152" fill="#1E40AF" font-size="11.5" font-weight="700" text-anchor="middle">
    Windows Forms POS Client App (.NET 8)
  </text>

  <!-- FormMainShell Box -->
  <rect x="45" y="165" width="290" height="85" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2" filter="url(#cardShadow)"/>
  <text x="190" y="188" fill="#1E293B" font-size="12" font-weight="700" text-anchor="middle">Single-Form Shell Workspace</text>
  <text x="55" y="210" fill="#475569" font-size="10.5">• FormMainShell.cs (Cửa sổ mẹ điều hướng)</text>
  <text x="55" y="228" fill="#475569" font-size="10.5">• Nhúng Form động (TopLevel = false, Dock = Fill)</text>
  <text x="55" y="244" fill="#475569" font-size="10.5">• Phân quyền ẩn/hiện nút Sidebar theo Role</text>

  <!-- Child Forms Box -->
  <rect x="45" y="260" width="290" height="110" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2" filter="url(#cardShadow)"/>
  <text x="190" y="282" fill="#1E293B" font-size="12" font-weight="700" text-anchor="middle">Các màn hình nghiệp vụ con</text>
  <text x="55" y="304" fill="#475569" font-size="10.5">• FormPOS.cs: Quầy bán lẻ quét barcode &amp; đổi điểm</text>
  <text x="55" y="322" fill="#475569" font-size="10.5">• FormProductManagement.cs: Quản lý hàng &amp; Phân trang</text>
  <text x="55" y="340" fill="#475569" font-size="10.5">• FormCategoryManagement.cs: Quản lý nhóm hàng</text>
  <text x="55" y="358" fill="#475569" font-size="10.5">• FormQuickReport.cs: Thẻ KPI, Biểu đồ &amp; Xuất Excel</text>

  <!-- Services Box -->
  <rect x="45" y="380" width="290" height="90" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2" filter="url(#cardShadow)"/>
  <text x="190" y="402" fill="#1E293B" font-size="12" font-weight="700" text-anchor="middle">Tầng Giao tiếp Dịch vụ Mạng</text>
  <text x="55" y="424" fill="#1D4ED8" font-size="10.5" font-weight="600">• ApiClientService.cs: Static readonly HttpClient</text>
  <text x="55" y="442" fill="#475569" font-size="10.5">• Tự động gắn Token: Authorization: Bearer</text>
  <text x="55" y="460" fill="#475569" font-size="10.5">• SessionManager.cs: Lưu trữ Token, Username, Role</text>

  <rect x="45" y="480" width="290" height="60" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="190" y="502" fill="#1E40AF" font-size="11" font-weight="700" text-anchor="middle">Thiết bị ngoại vi hỗ trợ</text>
  <text x="190" y="522" fill="#334155" font-size="10.5" text-anchor="middle">Máy quét mã vạch Laser Barcode Scanner &amp; Phím tắt F2/F9</text>


  <!-- ================= PROTOCOL 1: CLIENT -> API ================= -->
  <line x1="350" y1="290" x2="415" y2="290" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="415" y1="320" x2="350" y2="320" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
  <rect x="348" y="250" width="70" height="28" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="0.8"/>
  <text x="383" y="268" fill="#1E40AF" font-size="9" font-weight="700" text-anchor="middle">HTTPS / JSON</text>
  <text x="383" y="342" fill="#2563EB" font-size="8.5" font-weight="700" text-anchor="middle">Port 7237</text>


  <!-- ================= TIER 2: BUSINESS LOGIC TIER ================= -->
  <rect x="425" y="90" width="370" height="465" rx="14" fill="url(#t2Grad)" stroke="#C4B5FD" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="440" y="105" width="340" height="34" rx="6" fill="#7C3AED" />
  <text x="610" y="127" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">
    TẦNG DỊCH VỤ NGHIỆP VỤ (BUSINESS TIER)
  </text>
  <text x="610" y="152" fill="#6B21A8" font-size="11.5" font-weight="700" text-anchor="middle">
    ASP.NET Core 8 Web API (MiniSupermarket.API)
  </text>

  <!-- Middleware Pipeline Box -->
  <rect x="440" y="165" width="340" height="85" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2" filter="url(#cardShadow)"/>
  <text x="610" y="188" fill="#1E293B" font-size="12" font-weight="700" text-anchor="middle">Middleware Pipeline &amp; Security</text>
  <text x="450" y="210" fill="#475569" font-size="10.5">• CORS Policy: Cho phép kết nối WinForms</text>
  <text x="450" y="228" fill="#475569" font-size="10.5">• Authentication Middleware: Giải mã JWT Token</text>
  <text x="450" y="244" fill="#475569" font-size="10.5">• Authorization Middleware: Kiểm tra Role (Admin, Cashier)</text>

  <!-- Controllers Box -->
  <rect x="440" y="260" width="340" height="110" rx="8" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.2" filter="url(#cardShadow)"/>
  <text x="610" y="282" fill="#1E293B" font-size="12" font-weight="700" text-anchor="middle">RESTful Controllers</text>
  <text x="450" y="304" fill="#475569" font-size="10.5">• AuthController: Đăng nhập &amp; Ký Token HMAC-SHA256</text>
  <text x="450" y="322" fill="#475569" font-size="10.5">• ProductsController &amp; CategoriesController (CRUD)</text>
  <text x="450" y="340" fill="#475569" font-size="10.5">• AdoProductController: Tra cứu barcode tức thời</text>
  <text x="450" y="358" fill="#475569" font-size="10.5">• CheckoutController: Thanh toán &amp; Quản trị giao dịch</text>

  <!-- Data Access Layer -->
  <rect x="440" y="380" width="340" height="90" rx="8" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.2" filter="url(#cardShadow)"/>
  <text x="610" y="402" fill="#1E293B" font-size="12" font-weight="700" text-anchor="middle">Data Access Layer (DAL)</text>
  <text x="450" y="424" fill="#5B21B6" font-size="10.5" font-weight="600">• Entity Framework Core 8: Code-First, DbContext, LINQ</text>
  <text x="450" y="442" fill="#5B21B6" font-size="10.5" font-weight="600">• Raw ADO.NET: SqlDataReader tra cứu &lt; 2ms</text>
  <text x="450" y="460" fill="#5B21B6" font-size="10.5" font-weight="600">• SqlTransaction: Bọc chuỗi 4 thao tác thanh toán ACID</text>

  <!-- DI Container Box -->
  <rect x="440" y="480" width="340" height="60" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
  <text x="610" y="502" fill="#5B21B6" font-size="11" font-weight="700" text-anchor="middle">Bộ chứa phụ thuộc (DI Container)</text>
  <text x="610" y="522" fill="#334155" font-size="10.5" text-anchor="middle">SupermarketDbContext (Scoped) • IConfiguration (Singleton)</text>


  <!-- ================= PROTOCOL 2: API -> DB ================= -->
  <line x1="795" y1="290" x2="855" y2="290" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="855" y1="320" x2="795" y2="320" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
  <rect x="793" y="250" width="68" height="28" rx="4" fill="#D1FAE5" stroke="#86EFAC" stroke-width="0.8"/>
  <text x="827" y="268" fill="#065F46" font-size="9" font-weight="700" text-anchor="middle">ADO.NET</text>
  <text x="827" y="342" fill="#059669" font-size="8.5" font-weight="700" text-anchor="middle">Conn Pool</text>


  <!-- ================= TIER 3: DATA TIER ================= -->
  <rect x="865" y="90" width="285" height="465" rx="14" fill="url(#t3Grad)" stroke="#86EFAC" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="880" y="105" width="255" height="34" rx="6" fill="#059669" />
  <text x="1007" y="127" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">
    TẦNG DỮ LIỆU (DATA TIER)
  </text>
  <text x="1007" y="152" fill="#065F46" font-size="11.5" font-weight="700" text-anchor="middle">
    Microsoft SQL Server 2022
  </text>

  <!-- Database Name -->
  <rect x="880" y="165" width="255" height="50" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.2" filter="url(#cardShadow)"/>
  <text x="1007" y="186" fill="#1E293B" font-size="11" font-weight="700" text-anchor="middle">Cơ sở dữ liệu quan hệ:</text>
  <text x="1007" y="204" fill="#059669" font-size="10.5" font-weight="700" text-anchor="middle">NguyenTuanAnh_MiniSupperMakert</text>

  <!-- 6 Tables Box -->
  <rect x="880" y="225" width="255" height="155" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2" filter="url(#cardShadow)"/>
  <text x="1007" y="247" fill="#1E293B" font-size="11.5" font-weight="700" text-anchor="middle">6 Bảng thực thể chuẩn 3NF</text>
  <text x="895" y="270" fill="#475569" font-size="10.5">• Users (Tài khoản nhân sự)</text>
  <text x="895" y="290" fill="#475569" font-size="10.5">• Categories (Nhóm hàng tiện lợi)</text>
  <text x="895" y="310" fill="#475569" font-size="10.5">• Products (Hàng hóa &amp; Tồn kho)</text>
  <text x="895" y="330" fill="#475569" font-size="10.5">• Customers (Khách hàng thân thiết)</text>
  <text x="895" y="350" fill="#475569" font-size="10.5">• Orders (Hóa đơn bán lẻ tổng)</text>
  <text x="895" y="370" fill="#475569" font-size="10.5">• OrderDetails (Chi tiết mặt hàng)</text>

  <!-- Stored Procedures -->
  <rect x="880" y="390" width="255" height="85" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.2" filter="url(#cardShadow)"/>
  <text x="1007" y="412" fill="#1E293B" font-size="11.5" font-weight="700" text-anchor="middle">Stored Procedures T-SQL</text>
  <text x="895" y="433" fill="#065F46" font-size="10">• sp_GetRevenueByCashier</text>
  <text x="895" y="450" fill="#065F46" font-size="10">• sp_GetRevenueByDateRange</text>
  <text x="895" y="467" fill="#065F46" font-size="10">• sp_GetTop5SellingProducts</text>

  <!-- Integrity Constraints -->
  <rect x="880" y="485" width="255" height="55" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="1007" y="506" fill="#065F46" font-size="10.5" font-weight="700" text-anchor="middle">Ràng buộc toàn vẹn CSDL</text>
  <text x="1007" y="525" fill="#334155" font-size="10" text-anchor="middle">PK, FK, Unique Barcode, Check Price &gt; 0</text>

</svg>
