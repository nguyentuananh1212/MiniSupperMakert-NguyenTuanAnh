<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 560" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Shadow filter -->
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="diGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="18" width="1090" height="52" rx="10" fill="url(#headerGrad)" filter="url(#shadow)" />
  <text x="575" y="50" fill="#FFFFFF" font-size="16.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    HÌNH 1.2: SƠ ĐỒ KIẾN TRÚC BỘ CHỨA PHỤ THUỘC (DI CONTAINER) VÀ MIDDLEWARE PIPELINE TRONG ASP.NET CORE
  </text>

  <!-- ================= 1. CLIENT LAYER ================= -->
  <rect x="30" y="88" width="180" height="445" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="45" y="102" width="150" height="32" rx="6" fill="#475569" />
  <text x="120" y="123" fill="#FFFFFF" font-size="12.5" font-weight="700" text-anchor="middle">CLIENT APPS</text>

  <!-- WinForms Client -->
  <rect x="45" y="150" width="150" height="85" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#cardShadow)"/>
  <text x="120" y="174" fill="#1E293B" font-size="12" font-weight="700" text-anchor="middle">WinForms POS Client</text>
  <text x="120" y="196" fill="#64748B" font-size="10.5" text-anchor="middle">(MiniSupermarket.WinForms)</text>
  <text x="120" y="218" fill="#2563EB" font-size="10" font-weight="600" text-anchor="middle">• HttpClient Service</text>

  <!-- Swagger / Postman -->
  <rect x="45" y="255" width="150" height="85" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" filter="url(#cardShadow)"/>
  <text x="120" y="279" fill="#1E293B" font-size="12" font-weight="700" text-anchor="middle">Swagger UI / Browser</text>
  <text x="120" y="301" fill="#64748B" font-size="10.5" text-anchor="middle">Kiểm thử API trực tiếp</text>
  <text x="120" y="323" fill="#059669" font-size="10" font-weight="600" text-anchor="middle">• Gắn Bearer Token</text>

  <!-- Note box Client -->
  <rect x="45" y="360" width="150" height="155" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="120" y="385" fill="#1E40AF" font-size="11" font-weight="700" text-anchor="middle">Giao thức truyền nhận</text>
  <text x="55" y="412" fill="#334155" font-size="10">• RESTful HTTP/HTTPS</text>
  <text x="55" y="432" fill="#334155" font-size="10">• JSON Payload data</text>
  <text x="55" y="452" fill="#334155" font-size="10">• Header: Authorization</text>
  <text x="55" y="470" fill="#2563EB" font-size="9.5" font-weight="600">   Bearer &lt;JWT_Token&gt;</text>
  <text x="55" y="495" fill="#059669" font-size="10">• Port: 7237 / 5142</text>

  <!-- HTTP Request Line (Client -> Pipeline) -->
  <path d="M 195 190 L 255 190" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="225" y="180" fill="#2563EB" font-size="10" font-weight="700" text-anchor="middle">HTTP Req</text>

  <!-- HTTP Response Line (Pipeline -> Client) -->
  <path d="M 255 220 L 195 220" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
  <text x="225" y="238" fill="#EF4444" font-size="9.5" font-weight="700" text-anchor="middle">HTTP Res</text>


  <!-- ================= 2. MIDDLEWARE PIPELINE ================= -->
  <rect x="255" y="88" width="460" height="445" rx="12" fill="url(#pipeGrad)" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="270" y="102" width="430" height="32" rx="6" fill="#2563EB" />
  <text x="485" y="123" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">
    MIDDLEWARE PIPELINE (CHUỖI XỬ LÝ THEO THỨ TỰ NGHIÊM NGẶT)
  </text>

  <!-- Middleware 1: CORS -->
  <rect x="275" y="148" width="420" height="62" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="285" y="156" width="30" height="46" rx="4" fill="#DBEAFE"/>
  <text x="300" y="184" fill="#1D4ED8" font-size="13" font-weight="800" text-anchor="middle">1</text>
  <text x="325" y="173" fill="#1E293B" font-size="12" font-weight="700">app.UseCors("AllowAll")</text>
  <text x="325" y="195" fill="#475569" font-size="10.5">Cho phép mọi Origin, Header, Method gọi vào từ WinForms Client</text>

  <!-- Pipeline Down arrow 1 -> 2 -->
  <line x1="485" y1="210" x2="485" y2="225" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Middleware 2: Authentication -->
  <rect x="275" y="225" width="420" height="64" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="285" y="234" width="30" height="46" rx="4" fill="#DBEAFE"/>
  <text x="300" y="262" fill="#1D4ED8" font-size="13" font-weight="800" text-anchor="middle">2</text>
  <text x="325" y="250" fill="#1E293B" font-size="12" font-weight="700">app.UseAuthentication() (Xác thực JWT Token)</text>
  <text x="325" y="271" fill="#475569" font-size="10.5">Giải mã Token JWT, kiểm tra chữ ký &amp; thời hạn. Nạp ClaimsPrincipal</text>
  <text x="645" y="250" fill="#EF4444" font-size="10" font-weight="700">401 nếu lỗi</text>

  <!-- Pipeline Down arrow 2 -> 3 -->
  <line x1="485" y1="289" x2="485" y2="304" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Middleware 3: Authorization -->
  <rect x="275" y="304" width="420" height="64" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="285" y="313" width="30" height="46" rx="4" fill="#DBEAFE"/>
  <text x="300" y="341" fill="#1D4ED8" font-size="13" font-weight="800" text-anchor="middle">3</text>
  <text x="325" y="329" fill="#1E293B" font-size="12" font-weight="700">app.UseAuthorization() (Phân quyền truy cập)</text>
  <text x="325" y="350" fill="#475569" font-size="10.5">Kiểm tra thuộc tính [Authorize(Roles = "Admin, Cashier")] của Endpoint</text>
  <text x="645" y="329" fill="#EF4444" font-size="10" font-weight="700">403 nếu cấm</text>

  <!-- Pipeline Down arrow 3 -> 4 -->
  <line x1="485" y1="368" x2="485" y2="383" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Middleware 4: Routing & MapControllers -->
  <rect x="275" y="383" width="420" height="62" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="285" y="391" width="30" height="46" rx="4" fill="#DBEAFE"/>
  <text x="300" y="419" fill="#1D4ED8" font-size="13" font-weight="800" text-anchor="middle">4</text>
  <text x="325" y="407" fill="#1E293B" font-size="12" font-weight="700">app.MapControllers() (Endpoint Routing)</text>
  <text x="325" y="428" fill="#475569" font-size="10.5">Ánh xạ URL request tới đúng Controller Action (GET, POST, PUT, DELETE)</text>

  <!-- Pipeline Return Arrow Banner -->
  <rect x="275" y="460" width="420" height="58" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="485" y="482" fill="#B91C1C" font-size="11" font-weight="700" text-anchor="middle">
    ↩ LUỒNG PHẢN HỒI (REVERSE RESPONSE PIPELINE)
  </text>
  <text x="485" y="502" fill="#7F1D1D" font-size="10" text-anchor="middle">
    Sau khi Action thực thi xong, HTTP Response (200 OK, JSON) quay ngược qua các Middleware trả về Client
  </text>


  <!-- ================= 3. DEPENDENCY INJECTION (DI) CONTAINER ================= -->
  <!-- Top Right DI Box -->
  <rect x="740" y="88" width="380" height="195" rx="12" fill="url(#diGrad)" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="755" y="102" width="350" height="32" rx="6" fill="#7C3AED" />
  <text x="930" y="123" fill="#FFFFFF" font-size="12.5" font-weight="700" text-anchor="middle">
    BỘ CHỨA PHỤ THUỘC (DI CONTAINER - IServiceCollection)
  </text>

  <!-- DI Service items -->
  <rect x="755" y="146" width="350" height="38" rx="6" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1"/>
  <text x="765" y="169" fill="#5B21B6" font-size="11" font-weight="700">AddDbContext&lt;SupermarketDbContext&gt;</text>
  <text x="1055" y="169" fill="#6B21A8" font-size="10" font-weight="600">(Scoped)</text>

  <rect x="755" y="190" width="350" height="38" rx="6" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1"/>
  <text x="765" y="213" fill="#5B21B6" font-size="11" font-weight="700">IConfiguration (appsettings.json)</text>
  <text x="1045" y="213" fill="#6B21A8" font-size="10" font-weight="600">(Singleton)</text>

  <rect x="755" y="234" width="350" height="38" rx="6" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1"/>
  <text x="765" y="257" fill="#5B21B6" font-size="11" font-weight="700">AddAuthentication &amp; JWT Options</text>
  <text x="1045" y="257" fill="#6B21A8" font-size="10" font-weight="600">(Singleton)</text>


  <!-- ================= 4. CONTROLLER LAYER ================= -->
  <rect x="740" y="298" width="380" height="235" rx="12" fill="url(#ctrlGrad)" stroke="#86EFAC" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="755" y="312" width="350" height="32" rx="6" fill="#059669" />
  <text x="930" y="333" fill="#FFFFFF" font-size="12.5" font-weight="700" text-anchor="middle">
    TẦNG CONTROLLER &amp; CƠ SỞ DỮ LIỆU
  </text>

  <!-- Controller Box -->
  <rect x="755" y="356" width="350" height="110" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="930" y="378" fill="#065F46" font-size="12" font-weight="700" text-anchor="middle">
    ReportsController / ProductsController
  </text>
  <rect x="765" y="388" width="330" height="1" fill="#E2E8F0"/>
  <text x="775" y="408" fill="#1E293B" font-size="10.5" font-family="Consolas, monospace">
    // Constructor Injection nhận phụ thuộc:
  </text>
  <text x="775" y="426" fill="#1D4ED8" font-size="10.5" font-family="Consolas, monospace">
    public ReportsController(
  </text>
  <text x="790" y="443" fill="#7C3AED" font-size="10" font-family="Consolas, monospace">
    SupermarketDbContext db, IConfiguration cfg)
  </text>
  <text x="775" y="458" fill="#059669" font-size="10" font-family="Consolas, monospace">
    { _db = db; _configuration = cfg; }
  </text>

  <!-- Database info -->
  <rect x="755" y="476" width="350" height="46" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="1"/>
  <text x="930" y="496" fill="#38BDF8" font-size="11" font-weight="700" text-anchor="middle">
    SQL Server (NguyenTuanAnh_MiniSupperMakert)
  </text>
  <text x="930" y="512" fill="#94A3B8" font-size="9.5" text-anchor="middle">
    EF Core (DbSet) &amp; ADO.NET (Stored Procedure sp_GetRevenueByCashier...)
  </text>

  <!-- Arrows Connecting DI -> Controller -->
  <path d="M 930 283 L 930 312" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="980" y="296" fill="#7C3AED" font-size="10" font-weight="700">Tiêm (Inject)</text>

  <!-- Arrow Connecting MapControllers -> Controller -->
  <path d="M 695 414 L 745 414" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="720" y="404" fill="#2563EB" font-size="9" font-weight="700" text-anchor="middle">Invoke</text>

</svg>
