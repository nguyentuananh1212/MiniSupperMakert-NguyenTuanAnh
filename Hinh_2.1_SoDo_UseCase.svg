<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 780" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="16" width="1090" height="50" rx="10" fill="url(#headerGrad)" filter="url(#shadow)" />
  <text x="575" y="47" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    HÌNH 2.1: SƠ ĐỒ CA SỬ DỤNG (USE CASE DIAGRAM) TỔNG THỂ HỆ THỐNG SIÊU THỊ MINI FAMILY FRESH
  </text>

  <!-- System Boundary Box -->
  <rect x="250" y="80" width="650" height="675" rx="14" fill="#F8FAFC" stroke="#0284C7" stroke-width="2" stroke-dasharray="8,5" filter="url(#shadow)"/>
  <rect x="270" y="92" width="610" height="28" rx="5" fill="#E0F2FE"/>
  <text x="575" y="111" fill="#0369A1" font-size="13" font-weight="700" text-anchor="middle">
    HỆ THỐNG QUẢN LÝ SIÊU THỊ MINI FAMILY FRESH (SYSTEM BOUNDARY)
  </text>

  <!-- ================= ACTOR 1: ADMIN (LEFT TOP) ================= -->
  <!-- Stick figure Admin -->
  <g id="actor-admin" transform="translate(60, 200)">
    <circle cx="50" cy="25" r="16" fill="#F1F5F9" stroke="#1E293B" stroke-width="2.5"/>
    <line x1="50" y1="41" x2="50" y2="85" stroke="#1E293B" stroke-width="2.5"/>
    <line x1="18" y1="56" x2="82" y2="56" stroke="#1E293B" stroke-width="2.5"/>
    <line x1="50" y1="85" x2="22" y2="125" stroke="#1E293B" stroke-width="2.5"/>
    <line x1="50" y1="85" x2="78" y2="125" stroke="#1E293B" stroke-width="2.5"/>
    <rect x="-10" y="132" width="120" height="42" rx="6" fill="#1E293B" filter="url(#cardShadow)"/>
    <text x="50" y="150" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Quản trị viên</text>
    <text x="50" y="166" fill="#93C5FD" font-size="10.5" font-weight="600" text-anchor="middle">&lt;&lt;Admin&gt;&gt;</text>
  </g>

  <!-- ================= ACTOR 2: CASHIER (LEFT BOTTOM) ================= -->
  <g id="actor-cashier" transform="translate(60, 480)">
    <circle cx="50" cy="25" r="16" fill="#F1F5F9" stroke="#059669" stroke-width="2.5"/>
    <line x1="50" y1="41" x2="50" y2="85" stroke="#059669" stroke-width="2.5"/>
    <line x1="18" y1="56" x2="82" y2="56" stroke="#059669" stroke-width="2.5"/>
    <line x1="50" y1="85" x2="22" y2="125" stroke="#059669" stroke-width="2.5"/>
    <line x1="50" y1="85" x2="78" y2="125" stroke="#059669" stroke-width="2.5"/>
    <rect x="-10" y="132" width="120" height="42" rx="6" fill="#059669" filter="url(#cardShadow)"/>
    <text x="50" y="150" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Thu ngân</text>
    <text x="50" y="166" fill="#A7F3D0" font-size="10.5" font-weight="600" text-anchor="middle">&lt;&lt;Cashier&gt;&gt;</text>
  </g>

  <!-- ================= ACTOR 3: WAREHOUSE (RIGHT CENTER) ================= -->
  <g id="actor-warehouse" transform="translate(980, 320)">
    <circle cx="50" cy="25" r="16" fill="#F1F5F9" stroke="#D97706" stroke-width="2.5"/>
    <line x1="50" y1="41" x2="50" y2="85" stroke="#D97706" stroke-width="2.5"/>
    <line x1="18" y1="56" x2="82" y2="56" stroke="#D97706" stroke-width="2.5"/>
    <line x1="50" y1="85" x2="22" y2="125" stroke="#D97706" stroke-width="2.5"/>
    <line x1="50" y1="85" x2="78" y2="125" stroke="#D97706" stroke-width="2.5"/>
    <rect x="-10" y="132" width="120" height="42" rx="6" fill="#D97706" filter="url(#cardShadow)"/>
    <text x="50" y="150" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Thủ kho</text>
    <text x="50" y="166" fill="#FDE68A" font-size="10.5" font-weight="600" text-anchor="middle">&lt;&lt;Warehouse&gt;&gt;</text>
  </g>

  <!-- ================= USE CASES (OVALS) ================= -->

  <!-- UC1: Đăng nhập -->
  <ellipse cx="400" cy="160" rx="100" ry="26" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="400" y="164" fill="#1E3A8A" font-size="12.5" font-weight="700" text-anchor="middle">Đăng nhập hệ thống (JWT)</text>

  <!-- UC2: Bán hàng POS -->
  <ellipse cx="400" cy="510" rx="105" ry="28" fill="#ECFDF5" stroke="#059669" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="400" y="514" fill="#065F46" font-size="13" font-weight="700" text-anchor="middle">Quầy Bán lẻ POS</text>

  <!-- Sub UC: Tra cứu Barcode -->
  <ellipse cx="710" cy="460" rx="90" ry="24" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="710" y="464" fill="#0369A1" font-size="11.5" font-weight="600" text-anchor="middle">Tra cứu Barcode siêu tốc</text>

  <!-- Sub UC: Thanh toán Checkout -->
  <ellipse cx="710" cy="530" rx="90" ry="24" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="710" y="534" fill="#0369A1" font-size="11.5" font-weight="600" text-anchor="middle">Thanh toán Checkout (ACID)</text>

  <!-- Sub UC: Đổi điểm thưởng -->
  <ellipse cx="710" cy="600" rx="90" ry="24" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="710" y="604" fill="#5B21B6" font-size="11.5" font-weight="600" text-anchor="middle">Đổi điểm thưởng trừ tiền</text>

  <!-- UC3: Quản lý Sản phẩm -->
  <ellipse cx="680" cy="310" rx="105" ry="26" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="680" y="314" fill="#92400E" font-size="12.5" font-weight="700" text-anchor="middle">Quản lý Sản phẩm &amp; Tồn kho</text>

  <!-- UC4: Quản lý Nhóm hàng -->
  <ellipse cx="680" cy="235" rx="105" ry="26" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="680" y="239" fill="#92400E" font-size="12.5" font-weight="700" text-anchor="middle">Quản lý Nhóm hàng (Category)</text>

  <!-- UC5: Quản lý Khách hàng -->
  <ellipse cx="400" cy="370" rx="100" ry="26" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="400" y="374" fill="#1E3A8A" font-size="12" font-weight="700" text-anchor="middle">Quản lý Khách hàng thân thiết</text>

  <!-- UC6: Quản trị Tài khoản -->
  <ellipse cx="400" cy="250" rx="95" ry="26" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="400" y="254" fill="#1E3A8A" font-size="12" font-weight="700" text-anchor="middle">Quản trị Tài khoản nhân sự</text>

  <!-- UC7: Báo cáo Doanh thu -->
  <ellipse cx="400" cy="650" rx="105" ry="26" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.8" filter="url(#cardShadow)"/>
  <text x="400" y="654" fill="#5B21B6" font-size="12" font-weight="700" text-anchor="middle">Báo cáo Doanh thu &amp; Xuất Excel</text>


  <!-- ================= ASSOCIATION LINES ================= -->

  <!-- Admin connects to ALL main UCs -->
  <line x1="170" y1="240" x2="305" y2="165" stroke="#475569" stroke-width="1.5" />
  <line x1="170" y1="260" x2="305" y2="250" stroke="#475569" stroke-width="1.5" />
  <line x1="170" y1="275" x2="305" y2="365" stroke="#475569" stroke-width="1.5" />
  <line x1="170" y1="280" x2="320" y2="495" stroke="#475569" stroke-width="1.5" />
  <line x1="170" y1="270" x2="575" y2="245" stroke="#475569" stroke-width="1.5" />
  <line x1="170" y1="285" x2="575" y2="310" stroke="#475569" stroke-width="1.5" />
  <line x1="170" y1="300" x2="320" y2="635" stroke="#475569" stroke-width="1.5" />

  <!-- Cashier connects to Login, POS, Customer, and Report (own shift) -->
  <line x1="170" y1="520" x2="310" y2="175" stroke="#059669" stroke-width="1.8" />
  <line x1="170" y1="540" x2="295" y2="510" stroke="#059669" stroke-width="2" />
  <line x1="170" y1="535" x2="315" y2="385" stroke="#059669" stroke-width="1.8" />
  <line x1="170" y1="565" x2="310" y2="645" stroke="#059669" stroke-width="1.8" />

  <!-- Warehouse connects to Login, Categories, Products -->
  <line x1="970" y1="350" x2="490" y2="175" stroke="#D97706" stroke-width="1.8" />
  <line x1="970" y1="375" x2="785" y2="310" stroke="#D97706" stroke-width="2" />
  <line x1="970" y1="365" x2="780" y2="245" stroke="#D97706" stroke-width="2" />

  <!-- Include & Extend Relationships for POS -->
  <!-- POS -> Tra cứu Barcode (include) -->
  <line x1="495" y1="495" x2="620" y2="470" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>
  <rect x="522" y="468" width="68" height="18" rx="3" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="0.8"/>
  <text x="556" y="481" fill="#0284C7" font-size="9.5" font-weight="700" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- POS -> Checkout (include) -->
  <line x1="505" y1="515" x2="620" y2="525" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>
  <rect x="532" y="508" width="68" height="18" rx="3" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="0.8"/>
  <text x="566" y="521" fill="#0284C7" font-size="9.5" font-weight="700" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- POS -> Đổi điểm (extend) -->
  <line x1="500" y1="535" x2="620" y2="585" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>
  <rect x="532" y="555" width="68" height="18" rx="3" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="0.8"/>
  <text x="566" y="568" fill="#7C3AED" font-size="9.5" font-weight="700" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

</svg>
